name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration" --cov=deltaflow --cov-report=term-missing

  docker:
    name: Compose config and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet
      - name: Build API image
        run: docker build -t deltaflow-api:ci .

  integration:
    name: Full stack, integration tests and chaos proof
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Start the stack
        run: docker compose up -d --wait --build
      - name: Register the connector
        run: deltaflow register-connector
      - name: Integration tests
        run: pytest -m integration -v
      - name: Chaos proof (crash sinks and Debezium under load)
        run: deltaflow chaos --duration 40 --rate 15
      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 150 connect es-sink mongo-sink
      - name: Tear down
        if: always()
        run: docker compose down -v
