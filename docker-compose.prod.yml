# Production stack for a single VM (tested design target: Oracle Cloud Always Free, Ubuntu).
#
#   cp .env.prod.example .env.prod   # or: deltaflow gen-env --domain <host>   (fills in secrets)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait
#
# Differences from docker-compose.yml, all on purpose:
#   * Only Caddy (80/443, automatic HTTPS) is reachable from outside. Postgres, Kafka, Connect,
#     Elasticsearch and MongoDB publish no ports and live on a private network.
#   * Elasticsearch and MongoDB require credentials; the API refuses to start without a key and
#     protects everything except /health.
#   * Every secret comes from .env.prod; a missing one stops `compose up` instead of falling back
#     to a default password.
#   * Images are pulled (built by the release workflow), not built on the server.
#   * Memory limits, log rotation, restart policies.
#
# Kafka and Kafka Connect still speak plaintext without authentication. That is acceptable only
# because they are unreachable from outside the Docker network. See SECURITY.md.

name: deltaflow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ghcr.io/amitreddy14/deltaflow:${DELTAFLOW_VERSION:-latest}
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-sink-health: &sink-health
  # Workers touch a file every loop; a hung worker stops touching it and goes unhealthy.
  test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat') < 120 else 1)"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: losing this volume means re-issuing them
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # A stopped connector would otherwise make the replication slot hold WAL until the disk is
      # full. This caps it. The price: if the connector is down long enough to exceed the cap,
      # the slot is invalidated and the connector must be re-snapshotted (docs/deployment.md).
      - -c
      - max_slot_wal_keep_size=5GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deltaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # No EXTERNAL listener: nothing outside the Docker network can reach the broker.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Bound disk use: change topics keep 3 days or 2 GiB per partition, whichever comes first.
      # A sink that is down longer than this loses the ability to replay (docs/deployment.md).
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    volumes:
      - kafka-data:/var/lib/kafka/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: deltaflow-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    logging: *logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false" # traffic stays on the private Docker network
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env.prod}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongodb:
    image: mongo:7
    restart: unless-stopped
    logging: *logging
    environment:
      # Setting a root user is what turns authentication on for the whole server.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-deltaflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env.prod}
    volumes:
      - mongo-data:/data/db
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *app
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DELTAFLOW_ENVIRONMENT: production
      DELTAFLOW_AUTH_REQUIRED: "true"
      DELTAFLOW_API_KEY: ${DELTAFLOW_API_KEY:?set DELTAFLOW_API_KEY in .env.prod}
      DELTAFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DELTAFLOW_CONNECT_URL: http://connect:8083
      DELTAFLOW_ELASTICSEARCH_URL: http://elasticsearch:9200
      DELTAFLOW_ELASTICSEARCH_USER: elastic
      DELTAFLOW_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      DELTAFLOW_MONGO_URL: mongodb://${MONGO_ROOT_USER:-deltaflow}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      DELTAFLOW_POSTGRES_DSN: postgresql://${POSTGRES_USER:-deltaflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shop}
      # Used to render the Debezium connector config when it is registered through the API.
      POSTGRES_USER: ${POSTGRES_USER:-deltaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    mem_limit: 256m

  es-sink:
    <<: *app
    command: ["deltaflow", "run-es-sink"]
    stop_grace_period: 30s # SIGTERM lets the worker finish and commit its batch
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DELTAFLOW_ENVIRONMENT: production
      DELTAFLOW_HEARTBEAT_FILE: /tmp/heartbeat
      DELTAFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DELTAFLOW_ELASTICSEARCH_URL: http://elasticsearch:9200
      DELTAFLOW_ELASTICSEARCH_USER: elastic
      DELTAFLOW_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    healthcheck: *sink-health
    mem_limit: 384m

  mongo-sink:
    <<: *app
    command: ["deltaflow", "run-mongo-sink"]
    stop_grace_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DELTAFLOW_ENVIRONMENT: production
      DELTAFLOW_HEARTBEAT_FILE: /tmp/heartbeat
      DELTAFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DELTAFLOW_MONGO_URL: mongodb://${MONGO_ROOT_USER:-deltaflow}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
    healthcheck: *sink-health
    mem_limit: 384m

  # Optional: docker compose -f docker-compose.prod.yml --env-file .env.prod --profile monitoring up -d
  # Listens on the VM's loopback only; reach it with:  ssh -L 9090:127.0.0.1:9090 <vm>
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets/prometheus_api_key:/etc/prometheus/secrets/api_key:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m

volumes:
  postgres-data:
  kafka-data:
  elasticsearch-data:
  mongo-data:
  caddy-data:
  caddy-config:
  prometheus-data:
